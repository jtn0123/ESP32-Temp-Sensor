set noparent
# Keep include_order checks but ignore include_subdir to avoid mass edits
# Relax line length to match clang-format (100 chars) and reduce comment spacing conflicts
# legal/copyright is off: this project carries a single top-level LICENSE rather than
# a per-file copyright banner, so the check can never pass as written.
# runtime/int is off: every occurrence is a deliberate (long)/(unsigned long) cast
# feeding a %ld/%lu printf specifier, which is the portable idiom. Switching those
# to int32_t/uint32_t would force PRId32/PRIu32 macros for no benefit.
filter=+build/include_order,-build/include_subdir,+whitespace/braces,-whitespace/line_length,-whitespace/comments,-legal/copyright,-runtime/int
# Generated sources are excluded by firmware/arduino/src/CPPLINT.cfg, not here.
# cpplint matches exclude_files against one path component at a time while walking
# up from the file, so at this level the component is "firmware" and a list of
# paths never matches anything.

