# Copy to secrets.yaml (same directory or your ESPHome secrets location)
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
ota_password: "set-a-strong-ota-password"
# Password for the "room-node-setup" fallback hotspot. Must be 8+ characters,
# which is the WPA2 minimum ESPHome enforces. Generate a fresh one per device --
# joining this hotspot is enough to rewrite the node's wifi config, so a value
# shared across nodes means compromising one compromises all of them. Any node
# flashed before this key existed is still using the password that used to be
# hardcoded in room_node.yaml -- reflash those to rotate it.
ap_password: "REPLACE_ME_RUN_openssl_rand_base64_12"


